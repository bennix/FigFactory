appId: ai.figfactory.desktop
productName: BodyFactory 形体工坊
artifactName: FigFactory-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - main.js
  - preload.js
  - src/**/*
  - package.json
  - '!src/assets/*.icns'
asar: true
afterSign: scripts/notarize.cjs
mac:
  category: public.app-category.graphics-design
  icon: src/assets/app-icon.icns
  identity: "ZHIPING XU (5N66S29EK2)"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  sign: true
win:
  icon: src/assets/app-icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  icon: src/assets/app-icon.png
  category: Graphics
  synopsis: AI image studio with pose references and layered PSD export
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
publish: null
